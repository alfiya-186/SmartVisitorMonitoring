databases:
  - name: visitor-db
    databaseName: visitor_db
    user: visitor_user
    plan: free
    region: oregon

services:
  # 1. Backend Web Service (Flask API)
  - type: web
    name: visitor-backend
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: visitor-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.9

  # 2. Frontend Web Dashboard (Static Site)
  - type: web
    name: visitor-dashboard
    runtime: static
    rootDir: dashboard
    staticPublishPath: .

